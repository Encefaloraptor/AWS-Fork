<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f6f7fb, #dfe9ff);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        color: #1f2937;
      }

      .pokemon-card {
        width: min(420px, 90vw);
        background: white;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
        padding: 20px;
      }

      .pokemon-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }

      .pokemon-header img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        background: #eef2ff;
        border-radius: 50%;
      }

      .pokemon-header h2 {
        margin: 0;
        text-transform: capitalize;
        font-size: 2rem;
      }

      .pokemon-stats {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .pokemon-stats li {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #e5e7eb;
      }

      .stat-name {
        font-weight: bold;
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        width: min(420px, 90vw);
      }

      input[type="text"] {
        flex: 1;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        font-size: 1rem;
      }

      button {
        padding: 12px 18px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        font-weight: bold;
      }

      button:hover {
        background: #1d4ed8;
      }

      .cry-button {
        background: #ef4444;
        margin-top: 12px;
      }

      .cry-button:hover {
        background: #dc2626;
      }
    </style>
  </head>
  <body>
    <img src="https://extremely-unique-bucket-name.s3.us-east-1.amazonaws.com/Washed.jpg" alt="Imagen de gatito" />
    <div class="pokemon-card">
      <div class="pokemon-header">
        <img id="pokemon-image" src="" alt="Pokémon" />
        <h2 id="pokemon-name">Cargando...</h2>
      </div>
      <ul id="pokemon-stats" class="pokemon-stats"></ul>
    </div>

    <div class="controls">
      <input id="pokemon-search" type="text" placeholder="Escribe un Pokémon" />
      <button id="search-button" type="button">Buscar</button>
    </div>

    <button id="cry-button" class="cry-button" type="button">Play Cry</button>
    <audio id="audio" controls></audio>

    <script>
      const pokemonNameEl = document.getElementById("pokemon-name");
      const pokemonImageEl = document.getElementById("pokemon-image");
      const pokemonStatsEl = document.getElementById("pokemon-stats");
      const searchInput = document.getElementById("pokemon-search");
      const searchButton = document.getElementById("search-button");
      const cryButton = document.getElementById("cry-button");
      const audioEl = document.getElementById("audio");

      function formatName(name) {
        return name.charAt(0).toUpperCase() + name.slice(1);
      }

      function updatePokemonCard(data) {
        pokemonNameEl.textContent = formatName(data.name);
        const officialArt = data.sprites.other["official-artwork"];
        pokemonImageEl.src =
          officialArt?.front_default || data.sprites.front_default;
        pokemonImageEl.alt = data.name;

        pokemonStatsEl.innerHTML = "";
        data.stats.forEach((stat) => {
          const item = document.createElement("li");
          item.innerHTML = `
            <span class="stat-name">${formatName(stat.stat.name.replace("-", " "))}:</span>
            <span class="stat-value">${stat.base_stat}</span>
          `;
          pokemonStatsEl.appendChild(item);
        });

        const cryUrl = `https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${data.id}.ogg`;
        audioEl.src = cryUrl;
        audioEl.load();
      }

      async function fetchPokemon(pokemon) {
        const value = pokemon.trim();
        if (!value) {
          alert("Escribe el nombre o número de un Pokémon");
          return;
        }

        try {
          const response = await fetch(
            `https://pokeapi.co/api/v2/pokemon/${value.toLowerCase()}`,
          );
          if (!response.ok) {
            throw new Error("Pokémon no encontrado");
          }

          const data = await response.json();
          updatePokemonCard(data);
        } catch (error) {
          alert(error.message || "No se pudo buscar el Pokémon");
        }
      }

      searchButton.addEventListener("click", () =>
        fetchPokemon(searchInput.value),
      );
      searchInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          fetchPokemon(searchInput.value);
        }
      });

      cryButton.addEventListener("click", () => {
        if (audioEl.src) {
          audioEl.play();
        }
      });

      fetchPokemon("mothim");
    </script>
  </body>
</html>
